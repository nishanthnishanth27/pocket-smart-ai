{% extends "base.html" %}

{% block title %}
Login — PocketSmart AI
{% endblock %}

{% block content %}
<div class="auth-wrap">
    <form class="form-card" id="loginForm" autocomplete="on">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Login</h1>

        <label>
            Email
            <input
                name="email"
                type="email"
                required
                placeholder="you@example.com"
                autocomplete="email"
            >
        </label>

        <label>
            Password
            <input
                name="password"
                type="password"
                minlength="6"
                required
                placeholder="Enter your password"
                autocomplete="current-password"
            >
        </label>

        <button class="btn primary full" type="submit">Login</button>

        <p id="formError" class="error" aria-live="polite"></p>

        <p class="muted">
            New here?
            <a href="/register">Create an account</a>
        </p>
    </form>
</div>
{% endblock %}
