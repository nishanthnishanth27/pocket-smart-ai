{% extends "base.html" %}

{% block title %}
Register — PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-wrap">

    <form
        class="form-card"
        id="registerForm"
    >

        <p class="eyebrow">
            GET STARTED
        </p>

        <h1>
            Create account
        </h1>


        <label>

            Name

            <input
                name="name"
                minlength="2"
                maxlength="80"
                required
                placeholder="Your name"
            >

        </label>


        <label>

            Email

            <input
                name="email"
                type="email"
                required
                placeholder="you@example.com"
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                minlength="6"
                required
                placeholder="Minimum 6 characters"
            >

        </label>


        <button
            class="btn primary full"
            type="submit"
        >
            Create Account
        </button>


        <p
            id="formError"
            class="error"
        ></p>


        <p class="muted">

            Already registered?

            <a href="/login">
                Login
            </a>

        </p>

    </form>

</div>

{% endblock %}
